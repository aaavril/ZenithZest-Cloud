# CI en cada Pull Request: tests, calidad y seguridad de Terraform, secretos, imagen y plan comentado.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  tests-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q app/tests

  terraform-calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate (bootstrap y dev, sin backend)
        run: |
          for d in infra/bootstrap infra/envs/dev; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --chdir infra
      - name: Checkov (seguridad de IaC)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform,dockerfile,github_actions
          config_file: .checkov.yaml

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zenithzest:ci app
      - name: Trivy - reporte de vulnerabilidades (HIGH y CRITICAL)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 zenithzest:ci
      - name: Trivy - bloquea si hay CRITICAL con parche disponible
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 zenithzest:ci

  costos:
    # Infracost: comenta en el PR el costo mensual estimado de la infraestructura y su diferencia.
    # Requiere el secreto INFRACOST_API_KEY (gratis en infracost.io); sin él, el job se saltea.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: ¿Está cargada la clave de Infracost?
        id: clave
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Sin INFRACOST_API_KEY: se saltea."; fi
      - if: steps.clave.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.clave.outputs.ok == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - if: steps.clave.outputs.ok == 'true'
        name: Estimar costo (los valores de ejemplo no cambian el costo)
        run: |
          infracost breakdown --path=infra/envs/dev \
            --terraform-var-file=dev.tfvars \
            --terraform-var="project_id=zenithzest-ejemplo" \
            --terraform-var="image=us-central1-docker.pkg.dev/zenithzest-ejemplo/zenithzest/app:pr" \
            --terraform-var='alert_emails=["equipo@ejemplo.com"]' \
            --format=json --out-file=/tmp/infracost.json
      - if: steps.clave.outputs.ok == 'true'
        name: Comentar el costo en el PR
        run: |
          infracost comment github --path=/tmp/infracost.json \
            --repo="$GITHUB_REPOSITORY" --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" --behavior=update

  plan:
    needs: [terraform-calidad]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC hacia Google Cloud
      pull-requests: write  # comentar el plan
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
      TF_VAR_image: ${{ vars.IMAGE_REPO }}/app:${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s -var-file=dev.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Publicar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/envs/dev/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (recortado)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: '### Terraform plan (dev)\n```\n' + plan + '\n```'
            });
