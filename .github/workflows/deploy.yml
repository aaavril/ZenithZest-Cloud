# Merge a main: build de la imagen con el SHA del commit y apply con aprobación del environment "dev".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  IMAGE: ${{ vars.IMAGE_REPO }}/app:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" app
      - name: Trivy - bloquea si hay CRITICAL con parche disponible
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
      - run: docker push "$IMAGE"

  apply:
    needs: build
    runs-on: ubuntu-latest
    environment: dev   # aprobación manual (Settings > Environments > dev > Required reviewers)
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_alert_emails: ${{ vars.ALERT_EMAILS }}
      TF_VAR_image: ${{ vars.IMAGE_REPO }}/app:${{ github.sha }}
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -lock-timeout=120s -var-file=dev.tfvars -out=tfplan
      - run: terraform apply -input=false tfplan   # se aplica exactamente el plan de arriba
      - run: terraform output
